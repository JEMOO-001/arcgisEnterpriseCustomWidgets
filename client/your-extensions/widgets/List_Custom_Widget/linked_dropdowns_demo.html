<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تصنيف الراضي حسب المنطقة - Linked Dropdown Demo</title>
    <!-- Google Fonts: Tajawal for high-end Arabic typography -->
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --primary-gold: #D4A017;
            --secondary-gold: #F2D48E;
            --text-dark: #333333;
            --text-light: #666666;
            --bg-white: #FFFFFF;
            --bg-hover: #FFF9E6;
            --border-radius: 8px;
            --shadow-soft: 0 4px 12px rgba(0, 0, 0, 0.08);
        }

        body {
            font-family: 'Tajawal', sans-serif;
            background-color: #F8F9FA;
            color: var(--text-dark);
            margin: 0;
            padding: 40px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 24px;
        }

        /* ── Widget Container ── */
        .widget-component {
            width: 320px;
            position: relative;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .widget-label {
            font-size: 14px;
            font-weight: 700;
            color: var(--primary-gold);
            margin-bottom: 4px;
        }

        /* ── Toggle Button Style ── */
        .dropdown-btn {
            width: 100%;
            height: 48px;
            background: var(--bg-white);
            border: 1.5px solid var(--primary-gold);
            border-radius: var(--border-radius);
            padding: 0 16px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            font-size: 16px;
            font-weight: 500;
            cursor: pointer;
            color: var(--text-dark);
            transition: all 0.2s ease;
            box-sizing: border-box;
            outline: none;
        }

        .dropdown-btn:hover {
            box-shadow: 0 2px 8px rgba(212, 160, 23, 0.15);
            background-color: #FFFDF7;
        }

        .dropdown-btn:active {
            transform: scale(0.98);
        }

        .chevron {
            font-size: 12px;
            color: var(--primary-gold);
            transition: transform 0.3s ease;
        }

        .dropdown-btn.open .chevron {
            transform: rotate(180deg);
        }

        /* ── Dropdown List Style ── */
        .dropdown-list {
            position: absolute;
            top: 100%;
            left: 0;
            right: 0;
            margin-top: 6px;
            background: var(--bg-white);
            border: 1px solid var(--primary-gold);
            border-radius: var(--border-radius);
            box-shadow: var(--shadow-soft);
            list-style: none;
            padding: 8px 0;
            margin: 0;
            max-height: 250px;
            overflow-y: auto;
            z-index: 1000;
            display: none; /* Hidden by default */
            opacity: 0;
            transform: translateY(-10px);
            transition: all 0.25s ease;
        }

        .dropdown-list.show {
            display: block;
            opacity: 1;
            transform: translateY(0);
        }

        .dropdown-item {
            padding: 12px 16px;
            font-size: 15px;
            cursor: pointer;
            transition: background 0.1s ease;
            text-align: right;
        }

        .dropdown-item:hover {
            background-color: var(--bg-hover);
            color: var(--primary-gold);
        }

        .dropdown-item.selected {
            background-color: var(--bg-hover);
            color: var(--primary-gold);
            font-weight: 700;
        }

        /* ── Second Linked Widget (Display Card) ── */
        .linked-widget {
            width: 320px;
            min-height: 100px;
            background: #FFFFFF;
            border-radius: var(--border-radius);
            padding: 20px;
            border: 1px solid #E0E0E0;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            box-sizing: border-box;
            transition: all 0.3s ease;
        }

        .linked-widget.highlight {
            border-color: var(--primary-gold);
            box-shadow: 0 0 10px rgba(212, 160, 23, 0.1);
        }

        .linked-title {
            font-size: 13px;
            text-transform: uppercase;
            color: var(--text-light);
            margin-bottom: 8px;
            letter-spacing: 0.5px;
        }

        .linked-value {
            font-size: 22px;
            font-weight: 700;
            color: var(--primary-gold);
        }

        /* Scrollbar styling */
        .dropdown-list::-webkit-scrollbar { width: 6px; }
        .dropdown-list::-webkit-scrollbar-thumb { background: var(--primary-gold); border-radius: 10px; }
        .dropdown-list::-webkit-scrollbar-track { background: #F0F0F0; }
    </style>
</head>
<body>

    <!-- ── Widget 1: The Dropdown Component ── -->
    <div class="widget-component" id="categoryWidget">
        <div class="widget-label">تصنيف الراضي حسب المنطقة</div>
        
        <!-- Toggle Button -->
        <button class="dropdown-btn" id="dropdownBtn">
            <span id="selectedLabel">إختر المنطقة</span>
            <span class="chevron">▼</span>
        </button>

        <!-- Dropdown Menu -->
        <ul class="dropdown-list" id="dropdownList">
            <li class="dropdown-item" data-value="all">الكل</li>
            <li class="dropdown-item" data-value="zone1">المنطقة الأولى</li>
            <li class="dropdown-item" data-value="zone2">المنطقة الثانية</li>
            <li class="dropdown-item" data-value="zone3">المنطقة الثالثة</li>
            <li class="dropdown-item" data-value="zone4">المنطقة الرابعة</li>
        </ul>
    </div>

    <!-- ── Widget 2: The Linked Component (Reacts to selection) ── -->
    <div class="linked-widget" id="secondWidget">
        <div class="linked-title">المنطقة المختارة حالياً</div>
        <div class="linked-value" id="linkedDisplayLabel">لم يتم الاختيار</div>
    </div>

    <script>
        /**
         * ── Linked Dropdowns Logic ──
         */
        const dropdownBtn = document.getElementById('dropdownBtn');
        const dropdownList = document.getElementById('dropdownList');
        const selectedLabel = document.getElementById('selectedLabel');
        const secondWidget = document.getElementById('secondWidget');
        const linkedDisplayLabel = document.getElementById('linkedDisplayLabel');
        const dropdownItems = document.querySelectorAll('.dropdown-item');

        /**
         * 1. Toggle Dropdown visibility
         */
        dropdownBtn.addEventListener('click', (e) => {
            e.stopPropagation();
            const isOpen = dropdownList.classList.toggle('show');
            dropdownBtn.classList.toggle('open', isOpen);
        });

        /**
         * 2. Handle Selection & Update Linked Widget
         */
        dropdownItems.forEach(item => {
            item.addEventListener('click', () => {
                const label = item.textContent;
                const value = item.getAttribute('data-value');

                // Update Widget 1 UI
                selectedLabel.textContent = label;
                
                // Update active state in list
                dropdownItems.forEach(i => i.classList.remove('selected'));
                item.classList.add('selected');

                // Close dropdown
                closeDropdown();

                // ── LINKING LOGIC ──
                // This is where you connect the first widget to the second.
                // We call a "reaction" function that updates the siblings.
                updateLinkedWidget(label, value);
            });
        });

        /**
         * 3. Reaction Function: Logic to update the second widget
         * @param {string} label - The text label of selected option
         * @param {string} value - The machine value of selected option
         */
        function updateLinkedWidget(label, value) {
            console.log(`Linking logic triggered: ${value}`);
            
            // Add a brief highlight animation
            secondWidget.classList.remove('highlight');
            void secondWidget.offsetWidth; // Trigger reflow for animation
            secondWidget.classList.add('highlight');

            // Update the display text in the second widget
            if (value === 'all') {
                linkedDisplayLabel.textContent = 'جميع المناطق';
            } else {
                linkedDisplayLabel.textContent = label;
            }

            // EXTENSION: You can add more complex logic here, like AJAX calls 
            // or filtering a second list based on 'value'.
            // Example: if (value === 'zone1') { renderZone1Details(); }
        }

        /**
         * Helper: Close dropdown and reset visuals
         */
        function closeDropdown() {
            dropdownList.classList.remove('show');
            dropdownBtn.classList.remove('open');
        }

        /**
         * 4. Close when clicking anywhere outside
         */
        document.addEventListener('click', (e) => {
            if (!dropdownBtn.contains(e.target) && !dropdownList.contains(e.target)) {
                closeDropdown();
            }
        });

    </script>
</body>
</html>
